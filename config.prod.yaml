server:
  port: 8080
  base_url: ${BASE_URL}  # Will be set via environment variable

database:
  url: ${DATABASE_URL}  # Will be set via environment variable

redis:
  url: ${REDIS_URL}  # Will be set via environment variable
  ttl: 24h

cors:
  allowed_origins:
    - ${FRONTEND_URL}  # Will be set via environment variable
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
