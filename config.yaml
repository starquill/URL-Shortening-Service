server:
  port: 8080
  base_url: http://localhost:8080

database:
  url: postgres://postgres:postgres@localhost:5432/url_shortening_service

redis:
  url: localhost:6379
  ttl: 24h

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8080
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
 
  